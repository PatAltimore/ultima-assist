name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: tools/emsdk
          key: emsdk-6.0.6-${{ runner.os }}

      - name: Install Emscripten SDK
        run: |
          if [ ! -d tools/emsdk/upstream ]; then
            rm -rf tools/emsdk
            git clone https://github.com/emscripten-core/emsdk.git tools/emsdk
            (cd tools/emsdk && ./emsdk install 6.0.6)
          fi
          cd tools/emsdk
          ./emsdk activate 6.0.6

      - name: Build (Boron, game modules, engine, site folder)
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          source tools/emsdk/emsdk_env.sh
          bash build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
