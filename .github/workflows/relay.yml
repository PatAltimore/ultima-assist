name: Deploy download relay (Azure Static Web Apps)

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy relay
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RELAY }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: relay/app
          api_location: relay/api
          skip_app_build: true
